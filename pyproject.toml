[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "discordarr"
version = "0.1.0"
description = "One Discord bot for a household's media: books via Shelfmark, movies/shows/music via Radarr/Sonarr/Lidarr"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [
    "discord.py==2.5.2",
]

[project.scripts]
discordarr-bot = "discordarr.bot:main"
discordarr-healthcheck = "discordarr.heartbeat:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
